<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- =========================
         LOGIN
    ========================== -->

    <div class="card" id="loginCard">

        <h1>🔐 Controle Financeiro</h1>

        <p class="subtitulo">
            Entre na sua conta
        </p>

        <form id="formLogin">

            <label>E-mail</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="loginSenha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="trocar">
            Ainda não possui uma conta?

            <button
                type="button"
                class="link"
                onclick="mostrarCadastro()"
            >
                Criar conta
            </button>
        </p>

    </div>


    <!-- =========================
         CADASTRO
    ========================== -->

    <div
        class="card escondido"
        id="cadastroCard"
    >

        <h1>📝 Criar Conta</h1>

        <p class="subtitulo">
            Cadastre um novo usuário
        </p>

        <form id="formCadastro">

            <label>Nome</label>

            <input
                type="text"
                id="cadastroNome"
                placeholder="Digite seu nome"
                required
            >

            <label>E-mail</label>

            <input
                type="email"
                id="cadastroEmail"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="cadastroSenha"
                placeholder="Crie uma senha"
                required
            >

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <p class="trocar">
            Já possui uma conta?

            <button
                type="button"
                class="link"
                onclick="mostrarLogin()"
            >
                Fazer login
            </button>
        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
